<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11140f">
  <meta name="description" content="Analise partidas e jogue xadrez contra Stockfish.">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/styles.css">
  <title>Peleleca</title>
</head>
<body data-theme="green">
  <header class="appbar">
    <button class="home-button" data-view="analyze" aria-label="Início">♟</button>
    <strong id="screen-title">Partidas</strong>
    <div class="appbar-actions"><button class="icon-button" data-async id="backup" title="Exportar backup" aria-label="Exportar backup">⇧</button><button class="icon-button" data-async id="import-trigger" title="Importar backup" aria-label="Importar backup">⇩</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
  </header>
  <div id="notice" class="notice" role="status" hidden></div><div id="loading-indicator" class="loading-indicator" role="status" hidden>Processando…</div>

  <main class="app-shell">
    <section class="view active" id="view-analyze">
      <div class="hub-tools">
        <div class="source-tabs"><button class="source-tab selected" data-source="chesscom">Chess.com</button><button class="source-tab" data-source="pgn">PGN</button></div>
        <form id="chess-form" class="fetch-form"><div class="search-line"><label class="username-field"><span>@</span><input id="username" placeholder="Usuário do Chess.com" autocomplete="off" required></label><button class="fetch-button" data-async type="submit">Buscar</button></div><div class="month-field"><input id="month" type="month" aria-label="Mês das partidas"><button type="button" data-async class="text-button" id="archives">Recentes</button></div></form>
        <form id="pgn-form" class="pgn-form" hidden><textarea id="pgn-input" placeholder="Cole um PGN"></textarea><button class="fetch-button" data-async type="submit">Abrir partida</button></form>
      </div>
      <div class="list-heading"><span>PARTIDAS <b id="game-count">0</b></span><button id="filter-select">Todas⌄</button></div>
      <div id="games-list" class="games-list"><div class="empty-list">Busque partidas ou cole um PGN.</div></div>
    </section>

    <section class="view board-view" id="view-review">
      <div class="board-topline"><button class="back-button" id="back-to-hub" aria-label="Voltar às partidas">‹</button><div class="match-heading"><strong id="match-title">Partida</strong><span id="opponent-label">—</span></div><select id="depth" aria-label="Profundidade da análise"><option value="10">D10</option><option value="14" selected>D14</option><option value="18">D18</option></select></div>
      <div class="review-playerbar"><div class="player-chip"><span class="player-piece black-side">♚</span><strong id="review-black">Pretas</strong><span id="black-accuracy">—</span></div><span class="result-dot">·</span><div class="player-chip"><span class="player-piece white-side">♔</span><strong id="review-white">Brancas</strong><span id="white-accuracy">—</span></div></div>
      <div class="review-layout"><div class="eval-meter"><div id="eval-white" class="eval-white"></div><span id="eval-label">—</span></div><div class="board-wrap"><div class="board-coords top-coords"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div><div id="board" class="board" aria-label="Tabuleiro de análise"></div><div class="board-coords bottom-coords"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div><svg id="arrows" class="arrow-layer" viewBox="0 0 800 800" aria-hidden="true"><defs><marker id="green-head" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#c7fb7b"/></marker><marker id="blue-head" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#65b4ff"/></marker></defs><path id="best-arrow" class="arrow best-arrow" marker-end="url(#green-head)"/><path id="played-arrow" class="arrow played-arrow" marker-end="url(#blue-head)"/></svg></div></div>
      <div class="board-controls"><button id="first-move" aria-label="Primeiro lance">|‹</button><button id="prev-move" aria-label="Lance anterior">‹</button><span id="move-counter">—</span><button id="next-move" aria-label="Próximo lance">›</button><button id="last-move" aria-label="Último lance">›|</button><button id="flip-board" aria-label="Virar tabuleiro">⟳</button><button id="theme-open" aria-label="Tema do tabuleiro">◐</button><button id="analyze-button" data-async class="analyze-button" disabled>Analisar</button></div>
      <div id="theme-picker" class="theme-picker" hidden><button data-theme-choice="green">Verde</button><button data-theme-choice="purple">Lilás</button><button data-theme-choice="blue">Azul</button><button data-theme-choice="wood">Madeira</button></div>
      <div id="moves" class="moves"><span class="subtle">Selecione uma partida.</span></div>
      <div class="analysis-footer"><span id="review-result"> </span><span id="analysis-progress"></span><span id="move-feedback">Análise pendente</span><button id="save-analysis" class="text-button" hidden>Salvar</button></div>
    </section>

    <section class="view board-view play-view" id="view-play">
      <div class="board-topline"><button class="back-button" id="back-play" aria-label="Voltar às partidas">‹</button><div class="match-heading"><strong>Você <span class="versus">×</span> Stockfish</strong><span id="play-status">Pronto</span></div><button id="flip-play" class="icon-button" aria-label="Virar tabuleiro">⟳</button></div>
      <div class="play-board-area"><div class="clock-row"><span class="player-piece black-side">♚</span><strong id="black-name">Stockfish</strong><div class="clock" id="black-clock">10:00</div></div><div id="play-board" class="board play-board"></div><div class="clock-row"><span class="player-piece white-side">♔</span><strong id="white-name">Você</strong><div class="clock" id="white-clock">10:00</div></div></div>
      <div class="play-actions"><button id="resign" class="secondary-button">Desistir</button><button id="offer-draw" class="secondary-button">Empate</button><button id="takeback" class="secondary-button">↶</button></div>
      <div id="play-moves" class="play-moves"></div>
      <div id="post-game" class="post-game" hidden><strong id="result-title">Partida encerrada</strong><button id="analyze-played" class="primary-button">Analisar</button></div>
    </section>

    <section class="view library-view" id="view-library">
      <div class="library-tools"><button id="brilliant-filter" class="secondary-button">✦ Brilhantes</button><button id="library-export" data-async class="secondary-button">Exportar backup ⇧</button><button id="clear-library" class="text-button danger-text">Limpar</button></div>
      <div id="library-list" class="library-list"></div><div class="storage-foot" id="storage-usage">0 partidas</div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegação"><button class="nav-button active" data-view="analyze"><span>▤</span>Partidas</button><button class="nav-button" data-view="play"><span>♞</span>Jogar</button><button class="nav-button" data-view="library"><span>▣</span>Salvas</button></nav>

  <dialog id="setup-dialog" class="setup-dialog"><form id="setup-form" method="dialog"><div class="dialog-head"><strong>Nova partida</strong><button type="button" id="close-setup" class="icon-button" aria-label="Fechar">×</button></div><label>Lado<select id="setup-side"><option value="w">Brancas</option><option value="b">Pretas</option><option value="random">Aleatório</option></select></label><label>Desafio<select id="setup-level"><option value="capivara">Capivara · iniciante</option><option value="cavalomadeira">Cavalo de Madeira · casual</option><option value="bispotatico" selected>Bispo Tático · intermediário</option><option value="torredeaco">Torre de Aço · avançado</option><option value="reidafloresta">Rei da Floresta · mestre</option></select></label><label>Relógio<select id="setup-time"><option value="0">Sem relógio</option><option value="1">1 + 0 · Bullet</option><option value="2">2 + 1 · Bullet</option><option value="3">3 + 0 · Blitz</option><option value="4">3 + 2 · Blitz</option><option value="5">5 + 0 · Blitz</option><option value="6" selected>10 + 0 · Rápida</option><option value="7">15 + 10 · Rápida</option></select></label><button data-async class="primary-button dialog-start" type="submit">Começar</button></form></dialog>
  <script type="module" src="/js/app.js"></script>
</body></html>
